<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.dropdown-submenu .dropdown-toggle').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();

      let submenu = el.nextElementSibling;
      if (submenu) {
        submenu.classList.toggle('show');
      }

      // zatvori ostale otvorene podmenije
      el.closest('.dropdown-menu').querySelectorAll('.dropdown-menu.show').forEach(function(openSubmenu) {
        if(openSubmenu !== submenu) openSubmenu.classList.remove('show');
      });
    });
  });
});
</script>
